name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @madrent/deduper
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check the release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "${version}" == "${GITHUB_REF_NAME}" ]] || [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${package_version}" != "${version}" ]]; then
            echo "package.json has version ${package_version}, but the tag is ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - run: go test ./...

      - name: Build native binaries
        run: npm run build:npm:all -- --version "${{ steps.version.outputs.value }}"

      - run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public
